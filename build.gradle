plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '3.3.2'
    id 'jacoco'
}

group = 'com.dapanda'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    asciidoctorExt
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    snippetsDir = file("build/generated-snippets")
}

dependencies {

    // Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Bean Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Testcontainers
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:mysql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Spring Security + OAuth2 Client
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Bean Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Rest Docs
    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'

    // WebClient
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // MockWebServer
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    // Spring Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // AWS SDK for S3
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.696'

    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // Test
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Testcontainers
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:mysql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 테스트 실행 설정
test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    outputs.dir snippetsDir
    include '**/*Test.class'
}

// 스니펫 디렉토리 생성 태스크
tasks.register('createSnippetsDir') {
    doLast {
        mkdir snippetsDir
    }
}

tasks.named('asciidoctor') { dependsOn tasks.named('createSnippetsDir') }

asciidoctor {
    dependsOn test

    // 1) 테스트 스니펫 디렉토리 입력
    inputs.dir snippetsDir
    // 2) 마스터 Adoc 파일 입력
    inputs.file file('src/docs/asciidoc/api-docs.adoc')

    // Asciidoctor가 처리할 소스 파일 지정
    sourceDir = file('src/docs/asciidoc')
    sources {
        include 'api-docs.adoc'
    }

    configurations 'asciidoctorExt'

    // 스니펫을 Asciidoctor 리소스 경로에 복사
    resources {
        from(snippetsDir) {
            into 'snippets'
        }
    }

    outputDir = layout.buildDirectory.dir("docs/asciidoc").get().asFile

    // 스니펫 디렉토리가 없으면 생성
    doFirst {
        if (!file(snippetsDir).exists()) {
            mkdir snippetsDir
        }
    }
}

// 문서 없이 빌드하는 태스크 (개발용)
tasks.register('buildWithoutDocs') {
    group = 'build'
    description = 'Build application without running tests and generating docs'

    dependsOn 'clean', 'compileJava', 'processResources', 'classes'
    finalizedBy 'bootJar'

    doFirst {
        // bootJar에서 asciidoctor 의존성 제거
        bootJar.dependsOn = bootJar.dependsOn.findAll { it != asciidoctor }
    }
}

bootJar {
    // skipDocs 프로퍼티가 없으면 asciidoctor 실행 후 jar 생성
    if (!project.hasProperty('skipDocs')) {
        dependsOn asciidoctor
    }

    from(layout.buildDirectory.dir("docs/asciidoc")) {
        into "static/docs"
    }

    doFirst {
        def docsDir = asciidoctor.outputDir
        if (docsDir.exists() && docsDir.list().length > 0) {
            copy {
                from("${asciidoctor.outputDir}")
                into 'src/main/resources/static/docs'
            }
            println "API documentation copied to static resources"
        } else {
            println "No API documentation found, skipping copy"
        }
    }
}

// 불필요한 snippets 삭제
tasks.register('cleanUnwantedSnippets') {
    doLast {
        delete fileTree("build/generated-snippets") {
            include "**/*curl-request.adoc"
            include "**/*httpie-request.adoc"
            include "**/*request-body.adoc"
            include "**/*response-body.adoc"
        }
    }
}

// Jacoco 설정 (기존과 동일)
jacoco {
    toolVersion = "0.8.11"
}

def jacocoExcludePatterns = [
        'com/dapanda/Application.class',
        '**/common/**',
        '**/exception/**',
        '**/dto/**',
        '**/config/**',
        '**/test/**',
        'com/dapanda/auth/handler/OAuth2FailureHandler.class',
        'com/dapanda/auth/handler/OAuth2SuccessHandler.class',
        'com/dapanda/auth/service/CustomOAuth2UserService.class',
        'com/dapanda/jwt/JwtAuthenticationFilter.class',
        'com/dapanda/auth/oauth2/OAuth2UserInfo.class',
        'com/dapanda/auth/oauth2/KakaoOAuth2UserInfo.class',
        'com/dapanda/auth/oauth2/GoogleOAuth2UserInfo.class',
        'com/dapanda/auth/oauth2/NaverOAuth2UserInfo.class',
        'com/dapanda/auth/oauth2/OAuth2UserInfoFactory.class',
        'com/dapanda/auth/service/CustomUserDetailsService.class',
        'com/dapanda/auth/security/CustomUserDetails.class'
]

jacocoTestReport {
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, excludes: jacocoExcludePatterns)
        }))
    }
}

jacocoTestCoverageVerification {
    violationRules {

        rule {
            enabled = true
            element = 'CLASS'

            // 커버리지 제외 범위
            excludes = jacocoExcludePatterns
        }
    }
}

clean {
    delete file('src/main/generated')
    delete file('src/main/resources/static/docs')
}

test.finalizedBy cleanUnwantedSnippets

sourceSets {
    main {
        java { srcDirs = ['src/main/java'] }
    }
    test {
        java { srcDirs = ['src/test/java'] }
    }
}
