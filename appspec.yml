version: 0.0
os: linux

files:
  - source: app.jar
    destination: /home/ubuntu/app

hooks:
  BeforeInstall:
    - location: scripts/install.sh
      timeout: 300
      runas: ubuntu

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 180
      runas: ubuntu

    - location: scripts/start-promtail.sh
      timeout: 60
      runas: ubuntu
