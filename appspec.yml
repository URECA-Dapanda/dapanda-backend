version: 0.0
os: linux

files:
  - source: app.jar
    destination: /home/ubuntu/app
  - source: docker-compose.yml
    destination: /home/ubuntu

hooks:
  BeforeInstall:
    - location: scripts/install.sh
      timeout: 300
      runas: ubuntu
    - location: scripts/install-docker.sh
      timeout: 300
      runas: root
  
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 180
      runas: ubuntu

    - location: scripts/start-promtail.sh
      timeout: 120
      runas: ubuntu
