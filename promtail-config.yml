server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}

scrape_configs:
  - job_name: dapanda-log
    static_configs:
      - targets:
          - localhost
        labels:
          job: dapanda-log
          host: ${HOSTNAME}
          app: dapanda-server
          __path__: /var/log/app/*.log

    pipeline_stages:
      - regex:
          expression: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} \[\w+\] (?P<level>[A-Z]+)'
      - labels:
          level:
